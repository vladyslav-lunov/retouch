<!doctype html>
<meta charset="utf-8">
<title>retouch-lab</title>
<style>
:root{
  --bg:#16181c; --panel:#1e2126; --line:#2c3037; --ink:#e6e8ec;
  --dim:#9aa2ae; --acc:#6ea8fe; --warn:#e8a33d; --bad:#e06c6c; --ok:#6ec98a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
button,input,select{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:6px 11px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--acc)}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--acc);border-color:var(--acc);color:#0d1117;font-weight:600}
input[type=text],input[type=number]{background:#12141a;border:1px solid var(--line);
  border-radius:5px;padding:5px 7px;width:100%}
input[type=range]{width:100%;accent-color:var(--acc)}
.sel{flex:1;background:#12141a;border:1px solid var(--line);border-radius:5px;
  padding:5px 7px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);
  margin:18px 0 8px;font-weight:600}
h2:first-child{margin-top:0}
a{color:var(--acc)}
.wrap{display:grid;grid-template-columns:290px 1fr;height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:14px;
  overflow:auto}
button.go{width:100%;justify-content:center;display:flex;align-items:center;
  gap:7px;padding:9px}
.side .row label{display:flex;align-items:center;gap:4px}
.side .row label .ic{opacity:.45}
.side .row label:hover .ic{opacity:1;color:var(--acc)}
.main{overflow:auto;padding:14px 16px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:7px}
.row label{flex:0 0 104px;color:var(--dim);font-size:12px;line-height:1.25}
.row .val{flex:0 0 46px;text-align:right;font-variant-numeric:tabular-nums;
  color:var(--dim);font-size:12px}
.hint{color:var(--dim);font-size:11.5px;margin:-2px 0 10px}
.tabs{display:flex;flex-wrap:wrap;gap:2px;align-items:center;
  border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;
  background:none;padding:7px 9px;color:var(--dim);display:inline-flex;
  align-items:center;gap:6px;white-space:nowrap}
.tabs button:hover:not(.on){color:var(--ink);border-bottom-color:var(--line)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
.tabs button.on .ic{color:var(--acc)}
/* Роздільник між етапами: обрати кадр | подивитись | обробити | зібрати */
.tsep{width:1px;height:16px;background:var(--line);margin:0 6px}
.bar{display:inline-block;width:88px;height:6px;border-radius:3px;
  background:#232830;margin-right:9px;vertical-align:middle;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
  background:#12141a;border:1px solid var(--acc);border-radius:8px;
  padding:10px 16px;font-size:12.5px;box-shadow:0 10px 30px #0009;z-index:80;
  opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;
  max-width:60vw;white-space:pre-wrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{border-color:var(--bad)}
.tabs button.tips{border-bottom-color:transparent;padding:7px 10px}
.tabs button#expbtn .lbl{display:inline}
.mach{margin-left:6px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:10.5px;color:var(--dim);font-weight:400}
.doc.tech{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px;
  color:#7d8794}
/* Технічні хвости в прозі — лише в «Експерт». Посилання на специфікацію
   фотографу нічого не кажуть, а в режимі експерта вони й потрібні. */
body:not(.expert) [data-adv]{display:none}
.tabs button.tips.on{color:var(--acc)}
/* Тринадцять підписаних вкладок просять ~1300 px, а в панелі їх 958 —
   виходило три ряди. Тому підпис лишається на АКТИВНІЙ вкладці (щоб
   було видно, де ти), решта — іконка з підказкою на наведення. На
   широкому екрані підписи повертаються всім. */
.tabs button .lbl{display:none}
.tabs button.on .lbl{display:inline}
@media (min-width:1560px){.tabs button .lbl{display:inline}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  overflow:hidden}
.card .cap{padding:5px 8px;font-size:11px;color:var(--dim);
  border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.card img{display:block;width:100%;background:#0d0f13}
.note{border:1px solid var(--line);border-left:3px solid var(--warn);
  background:#221d14;border-radius:6px;padding:8px 11px 8px 32px;
  margin-bottom:10px;white-space:pre-wrap;font-size:11.5px;line-height:1.45;
  position:relative}
.note::before{content:"";position:absolute;left:11px;top:9px;width:14px;
  height:14px;background:var(--warn);
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M8 1.8 15 14H1z' fill='none' stroke='black' stroke-width='1.6' stroke-linejoin='round'/><path d='M8 6v4' stroke='black' stroke-width='1.6' stroke-linecap='round'/><circle cx='8' cy='12' r='.8'/></svg>") center/contain no-repeat;
  mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M8 1.8 15 14H1z' fill='none' stroke='black' stroke-width='1.6' stroke-linejoin='round'/><path d='M8 6v4' stroke='black' stroke-width='1.6' stroke-linecap='round'/><circle cx='8' cy='12' r='.8'/></svg>") center/contain no-repeat}
.note.bad::before{background:var(--bad)}
.note.bad{border-left-color:var(--bad);background:#241618}
.stages{font-variant-numeric:tabular-nums;font-size:12px}
.stages div{display:flex;justify-content:space-between;padding:2px 0;
  color:var(--dim)}
.stages b{color:var(--ink);font-weight:500}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:6px 9px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase}
tr.on td{background:#1b2430}
/* Портретний кадр по ширині панелі виходить на 1200+ px заввишки, і щоб
   клацнути по обличчю, доводилось гортати. Тому обмежуємо ВИСОТОЮ, а
   ширину лишаємо авто: увесь кадр видно одразу. */
#stage{background:#0d0f13;border:1px solid var(--line);border-radius:8px;
  padding:8px;display:flex;justify-content:center}
.holder{position:relative;display:inline-block;line-height:0;
  cursor:crosshair;touch-action:none}
.holder img{display:block;width:auto;max-width:100%;max-height:62vh;
  min-width:40px;min-height:40px}
#paint{position:absolute;inset:0;width:100%;height:100%}
#pin{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;
  border:2px solid var(--acc);border-radius:50%;pointer-events:none;
  box-shadow:0 0 0 1px #000}
.pick{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.pick div{padding:5px 8px;cursor:pointer;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;gap:8px}
.pick div:hover{background:#232830}
.pick .d{color:var(--acc)}
.pick .raw{color:var(--warn)}
.tag{display:inline-block;padding:1px 6px;border-radius:4px;background:#232830;
  color:var(--dim);font-size:11px;margin-left:6px}
/* У мітці стоїть МАШИННЕ ім'я — те, що людина напише в YAML. h2 робить
   верхній регістр, і виходило EYE_VESSELS: скопіювавши, отримаєш
   «невідомий інструмент». Тому регістр тут явно нормальний. */
h2 .tag{text-transform:none;letter-spacing:0;font-family:ui-monospace,
  SFMono-Regular,Menlo,monospace}
.crops{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--line);
  border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;
  vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
kbd{background:#232830;border:1px solid var(--line);border-radius:4px;
  padding:0 5px;font-size:11px}

/* ---------- іконки, підказки, згортання ---------- */
/* Іконки — інлайновий SVG-спрайт, а не емодзі: емодзі на різних машинах
   різні за розміром і кольором, і в темній панелі виглядають іграшкою. */
.ic{width:15px;height:15px;flex:0 0 15px;stroke:currentColor;fill:none;
  stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;
  vertical-align:-2px}
.ic.sm{width:13px;height:13px;flex-basis:13px}

/* Підказка на наведення. Своя, а не title: нативна спливає через
   секунду й не вміє переносити рядки, а тут пояснення на два речення. */
[data-tip]{position:relative}
[data-tip]:hover::after{
  content:attr(data-tip);position:absolute;left:0;top:calc(100% + 6px);
  z-index:40;width:max-content;max-width:320px;white-space:pre-wrap;
  background:#0d0f13;color:var(--ink);border:1px solid var(--line);
  border-radius:7px;padding:8px 10px;font-size:11.5px;line-height:1.4;
  box-shadow:0 8px 24px #0008;pointer-events:none;font-weight:400}
[data-tip].tipr:hover::after{left:auto;right:0}
[data-tip].tipup:hover::after{top:auto;bottom:calc(100% + 6px)}

/* Пояснення згортається, ПОПЕРЕДЖЕННЯ — ніколи. Це не косметика:
   §1 будується на тому, що конвеєр нічого не робить мовчки, і сховати
   «39 зі 154 знахідок на шиї» за кнопкою означало б це порушити.
   Ховається лише те, що пояснює, ЯК користуватись. */
.why-btn{display:inline-flex;align-items:center;gap:5px;border:0;
  background:none;color:var(--dim);padding:2px 0;font-size:11.5px;
  cursor:pointer;margin-bottom:8px}
.why-btn:hover{color:var(--acc);border:0}
.why-btn .ic{width:13px;height:13px;flex-basis:13px}
.why-body{display:none}
.why-open .why-body{display:block}
.why-open .why-btn .chev{transform:rotate(90deg)}
.chev{transition:transform .15s}

/* Смужка стану: числа кадру чипами, кожен зі своїм поясненням. */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 2px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;
  border:1px solid var(--line);border-radius:999px;background:#12141a;
  font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.chip b{color:var(--ink);font-weight:600}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.chip.warn b{color:var(--warn)}
.chip.ok{border-color:var(--ok)}

/* Розділи лівої панелі згортаються — їх сім, і одночасно потрібен один. */
.sect>summary{list-style:none;cursor:pointer;display:flex;align-items:center;
  gap:7px;font-size:12px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--dim);font-weight:600;margin:16px 0 9px;user-select:none}
.sect>summary::-webkit-details-marker{display:none}
.sect>summary:hover{color:var(--ink)}
.sect[open]>summary .chev{transform:rotate(90deg)}
.sect:first-of-type>summary{margin-top:0}

/* Поля нових вкладок будуються зі схеми, тому їх кількість заздалегідь
   невідома: сітка, що сама вирішує, скільки колонок влізе. */
.flds{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));
  gap:10px;margin-bottom:12px}
.fld{background:var(--panel);border:1px solid var(--line);border-radius:7px;
  padding:8px 10px}
.fld label{display:block;color:var(--ink);font-size:12px;margin-bottom:5px;
  font-weight:500}
.fld .doc{color:var(--dim);font-size:11px;margin-top:5px;line-height:1.35}
.fld.set{border-color:var(--acc)}
.fld input[type=checkbox]{accent-color:var(--acc);width:15px;height:15px}
.bar{display:flex;gap:8px;align-items:center;margin:0 0 12px}
/* .pick розкладає рядок у флекс-ряд — тут навпаки: назва, причина й
   список розділів мають іти один під одним, інакше причина стискається
   в колонку на три слова й читати її неможливо. */
.plist div{display:block;padding:8px 10px;border-bottom:1px solid var(--line);
  cursor:pointer}
.plist div:hover{background:#232830}
.roll{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:6px;margin-bottom:12px}
.roll div{display:flex;justify-content:space-between;gap:8px;padding:7px 9px;
  border:1px solid var(--line);border-radius:6px;cursor:pointer;
  background:var(--panel);font-size:12px}
.roll div:hover{border-color:var(--acc)}
.roll div.cur{border-color:var(--acc);background:#1b2430}
.roll div.done{color:var(--dim)}
.roll .ok{color:var(--ok)}
.roll .fail{color:var(--bad)}
.plist .why{color:var(--dim);font-size:11.5px;margin-top:3px;white-space:pre-wrap}
.plist b{font-weight:600}
pre.yaml{background:#12141a;border:1px solid var(--line);border-radius:7px;
  padding:10px 12px;overflow:auto;font-size:12px;color:var(--dim);margin:0 0 12px}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>

<symbol id="i-eye" viewBox="0 0 16 16"><path d="M1 8s2.5-4.5 7-4.5S15 8 15 8s-2.5 4.5-7 4.5S1 8 1 8z"/><circle cx="8" cy="8" r="2"/></symbol>

<div class="wrap">
<div class="side">
  <!-- Дії — НАГОРІ, бо натискають їх найчастіше, а решта панелі
       налаштовується раз на зйомку. Розділи згортаються: їх сім, а
       одночасно потрібен один. -->
  <button id="rerun" class="pri go"
    data-tip="Маска, детекція, лікування по поточних параметрах. На 26 Мп ~30 с"><svg class="ic"><use href="#i-play"/></svg>Перегнати</button>
  <div class="row" style="margin-top:6px">
    <input type="text" id="out" value="out" placeholder="тека виводу"
      data-tip="Куди писати базу, шари й зведений файл">
    <button id="write" data-tip="Записати стопку: база, шари з альфою, зведений кадр, маски"><svg class="ic"><use href="#i-save"/></svg>Зберегти</button>
  </div>
  <div id="stages" class="stages"></div>
  <div id="chips" class="chips"></div>

  <details class="sect" open>
    <summary><svg class="ic chev"><use href="#i-chev"/></svg>
      <svg class="ic"><use href="#i-folder"/></svg>Кадр</summary>
    <div class="row"><input type="text" id="path" placeholder="шлях до кадру"></div>
    <div class="row">
      <button id="browse" data-tip="Пройтись теками й обрати файл">Огляд…</button>
      <button id="open" class="pri" style="flex:1">Відкрити</button>
    </div>
    <div id="picker" hidden><div class="pick" id="picklist"></div></div>
    <div id="info" class="hint"></div>
  </details>

  <details class="sect" open>
    <summary><svg class="ic chev"><use href="#i-chev"/></svg>
      <svg class="ic"><use href="#i-spots"/></svg>Ретуш шкіри</summary>
    <div class="row"><label data-tip="Скільки шкіри дозволено торкнутися. Поріг тоді підбирається під кожен кадр окремо.

Це головний параметр: поріг контрасту між кадрами не переноситься — на 44 реальних кадрах фіксовані 0.012 дали від 0% до 24% торкнутої шкіри. Ціль переноситься. 3% — робоче значення.">сила ретуші <svg class="ic sm"><use href="#i-q"/></svg></label>
      <input type="range" id="target_coverage" min="0" max="0.12" step="0.005" value="0">
      <span class="val" id="target_coverage_v">вимк</span></div>
    <div class="row" data-adv="1"><label data-tip="Мінімальний контраст плями. Працює, лише коли ціль вимкнена.

МІЖ КАДРАМИ НЕ ПЕРЕНОСИТЬСЯ — задавай для одного конкретного кадру, для зйомки бери ціль.">поріг <svg class="ic sm"><use href="#i-q"/></svg></label>
      <input type="range" id="threshold" min="0.004" max="0.04" step="0.001" value="0.012">
      <span class="val" id="threshold_v">0.012</span></div>
    <div class="row" data-adv="1"><label data-tip="Радіус частотного розділення, px. «Авто» — рахується з ширини обличчя (1200 px → 6 px).

Нижче 2 px частотка вже не відділяє дефект від пікселя, тож на дрібних обличчях радіус упирається в підлогу — панель про це скаже.">радіус <svg class="ic sm"><use href="#i-q"/></svg></label>
      <input type="range" id="radius" min="0" max="24" step="0.5" value="0">
      <span class="val" id="radius_v">авто</span></div>
    <div class="row" data-adv="1"><label data-tip="Найменша площа плями в px. Дрібніше — це зерно, а не дефект">мін. площа</label>
      <input type="number" id="min_area" value="8"></div>
    <div class="row" data-adv="1"><label data-tip="Найбільша площа. Більше — це тінь або велика структура, і підміняти її текстурою не можна">макс. площа</label>
      <input type="number" id="max_area" value="1200"></div>
    <div class="row" data-adv="1"><label data-tip="Відношення сторін рамки. Витягнуте — це волосина або край, не пляма">витягнутість</label>
      <input type="range" id="max_elongation" min="1.5" max="12" step="0.5" value="6">
      <span class="val" id="max_elongation_v">6</span></div>
  </details>

  <details class="sect" open>
    <summary><svg class="ic chev"><use href="#i-chev"/></svg>
      <svg class="ic"><use href="#i-tools"/></svg>Тонко</summary>
    <div class="row"><label data-tip="Множник альфи дотику — прямий аналог непрозорості шару. Те саме можна зробити потім на вкладці «Шари», не переганяючи">сила <svg class="ic sm"><use href="#i-q"/></svg></label>
      <input type="range" id="strength" min="0.1" max="1" step="0.05" value="1">
      <span class="val" id="strength_v">1</span></div>
    <div class="row" data-adv="1"><label data-tip="Як далеко шукати чисту текстуру на заміну, px. «Авто» — 7.5% ширини обличчя.

Фіксоване число тут шкодить: на реальній зйомці обличчя гуляє від 191 до 1582 px, і 90 px означали то 47% ширини обличчя, то 5.7%.">пошук донора <svg class="ic sm"><use href="#i-q"/></svg></label>
      <input type="range" id="search_radius" min="0" max="300" step="10" value="0">
      <span class="val" id="search_radius_v">авто</span></div>
    <div class="row"><label data-tip="Лікувати лише N найконтрастніших плям. Порожньо — усі">ліміт плям</label>
      <input type="number" id="limit" placeholder="усі"></div>
    <div class="row" data-adv="1"><label data-tip="Відступ від краю маски шкіри, px. Щоб лікування не підповзало під волосся й губи">ерозія маски</label>
      <input type="range" id="mask_erode" min="0" max="24" step="1" value="6">
      <span class="val" id="mask_erode_v">6</span></div>
  </details>

  <details class="sect">
    <summary><svg class="ic chev"><use href="#i-chev"/></svg>
      <svg class="ic"><use href="#i-face"/></svg>Розпізнавання</summary>
    <div class="row"><label data-tip="BiSeNet: каже, де шкіра, де око, де рот. БЕЗ НЬОГО маска евристична — тест на колір, а не на обличчя, і на реальному портреті вона віддає 90+% кадру">face-parsing <svg class="ic sm"><use href="#i-q"/></svg></label>
      <select id="face_model" class="sel"><option value="">евристика</option></select></div>
    <div class="row"><label data-tip="YuNet: знаходить обличчя й кропає його для face-parsing. З нього ж береться ширина обличчя для радіусів">детектор <svg class="ic sm"><use href="#i-q"/></svg></label>
      <select id="face_detector" class="sel"><option value="">без кропа</option></select></div>
    <div class="row"><label data-tip="LaMa для видалення об'єктів. Без нього запасний Telea — годиться лише для дрібного">інпейнт <svg class="ic sm"><use href="#i-q"/></svg></label>
      <select id="lama_model" class="sel"><option value="">Telea</option></select></div>
    <div class="hint" id="models_hint">шукаю моделі в models/…</div>
    <div class="row" data-adv="1"><label data-tip="Чим читати RAW. Вибір зсуває поріг: ImageIO додає своє шумозаглушення й різкість у високу частоту, і плям знаходиться втричі більше на тому самому порозі. Порівнювати прогони різними декодерами не можна">RAW через <svg class="ic sm"><use href="#i-q"/></svg></label>
      <select id="raw_decoder" class="sel">
        <option value="">авто</option><option value="rawpy">rawpy (libraw)</option>
        <option value="imageio">ImageIO (Apple)</option></select></div>
  </details>
</div>

<div class="main">
  <!-- Вкладки згруповані за етапами конвеєра, а не звалені в ряд: їх
       тринадцять, і плаский ряд не каже, що йде за чим. Порядок груп —
       порядок роботи: обрати кадр, проявити, ретушувати, зібрати. -->
  <div class="tabs">
    <button data-t="shoot" data-tip="Тека зйомки: усі кадри, навігація ← →, пакетний прогін"><svg class="ic"><use href="#i-folder"/></svg><span class="lbl">Зйомка</span></button>
    <span class="tsep"></span>
    <button data-t="view" class="on" data-tip="Загальний план: чи не полізло воно кудись. Про якість ретуші НЕ судити тут"><svg class="ic"><use href="#i-eye"/></svg><span class="lbl">Перегляд</span></button>
    <button data-t="crops" data-tip="Вирізки в рідних пікселях. ЄДИНЕ місце, де видно якість ретуші "><svg class="ic"><use href="#i-zoom"/></svg><span class="lbl">1:1</span></button>
    <span class="tsep"></span>
    <button data-t="develop" data-tip="Експозиція, ББ, крива, кроп. Перший етап — усе подальше рахується по цьому кадру"><svg class="ic"><use href="#i-develop"/></svg><span class="lbl">Проявлення</span></button>
    <button data-t="mask" data-tip="Що вважати шкірою: класи face-parsing і пензель"><svg class="ic"><use href="#i-mask"/></svg><span class="lbl">Маска</span></button>
    <button data-t="spots" data-tip="Список знайдених плям: які лікувати, які лишити"><svg class="ic"><use href="#i-spots"/></svg><span class="lbl">Плями</span></button>
    <button data-t="tools" data-tip="Судини в очах, зуби, матування, тон шкіри — кожен у межах свого класу"><svg class="ic"><use href="#i-tools"/></svg><span class="lbl">Інструменти</span></button>
    <button data-t="db" data-tip="Вирівнювання низької частоти. Текстура не чіпається"><svg class="ic"><use href="#i-db"/></svg><span class="lbl">Світлотінь</span></button>
    <button data-t="remove" data-tip="Прибрати об'єкт або людину (LaMa)"><svg class="ic"><use href="#i-remove"/></svg><span class="lbl">Видалення</span></button>
    <button data-t="warp" data-tip="Геометрія: поле зміщення, пластика"><svg class="ic"><use href="#i-warp"/></svg><span class="lbl">Пластика</span></button>
    <span class="tsep"></span>
    <button data-t="layers" data-tip="Непрозорість шарів. Складання, а не перегін — відповідає миттєво"><svg class="ic"><use href="#i-layers"/></svg><span class="lbl">Шари</span></button>
    <button data-t="presets" data-tip="Пресети агента: накласти, порівняти на кадрі, записати"><svg class="ic"><use href="#i-preset"/></svg><span class="lbl">Пресети</span></button>
    <button data-t="sweep" data-tip="Той самий кадр кількома порогами — таблиця калібрування"><svg class="ic"><use href="#i-sweep"/></svg><span class="lbl">Калібрування</span></button>

      data-tip="Просто — те, що крутять щодня, людськими назвами.
Експерт — усі поля, машинні імена й технічні описи.

Нічого не ховається назавжди: це той самий набір, просто не весь одразу."><svg class="ic"><use href="#i-tools"/></svg><span class="lbl">Просто</span></button>
    <button id="tipsbtn" class="tips tipr"
      data-tip="Показувати пояснення під заголовками вкладок.

Попередження про кадр не ховаються ніколи — вони про те, що сталося саме тут."><svg class="ic"><use href="#i-q"/></svg></button>

<script>
const $ = s => document.querySelector(s);
const api = async (u, o) => (await fetch(u, o)).json();
const post = (u, b) => api(u, {method:'POST', headers:{'Content-Type':'application/json'},
                               body: JSON.stringify(b||{})});
const PARAMS = ['threshold','target_coverage','radius','min_area','max_area','max_elongation',
                'strength','search_radius','limit','mask_erode','raw_decoder',
                'face_model','face_detector','lama_model'];
let S = {}, tab = 'view', keep = null, cropAt = null, painting = false, brush = 'add';

function params(){
  const p = {};
  for (const k of PARAMS){
    const v = $('#'+k).value;
    // 0 у цих двох означає «не задано», а не нуль: радіус тоді
    // рахується з ширини обличчя, ціль — вимкнена й працює поріг
    if (v !== '' && !(['radius', 'target_coverage', 'search_radius'].includes(k)
                      && +v === 0))
      p[k] = v;
  }
  return p;
}
for (const k of PARAMS){
  const el = $('#'+k), v = $('#'+k+'_v');
  if (v) el.oninput = () => v.textContent =
    ((k === 'radius' || k === 'search_radius') && +el.value === 0) ? 'авто' :
    (k === 'target_coverage')
      ? (+el.value === 0 ? 'вимк' : (+el.value * 100).toFixed(1) + '%')
      : el.value;
}

/* ---------- стан ---------- */
async function tick(){
  S = await api('/api/state');
  /* Етапи людською. «freq-split 1.07s radius=3.7px» — це те, що я пишу
     собі в лог; фотографу треба знати, що зараз відбувається і чи
     скінчилось. Секунди й ноти лишаються в «Експерт»: там вони і є
     тим, заради чого дивляться. */
  const STAGE = {
    read: 'Читаю кадр', develop: 'Проявляю', 'skin-mask': 'Шукаю обличчя',
    'freq-split': 'Розкладаю на частоти', 'solve-threshold': 'Підбираю силу',
    detect: 'Шукаю дефекти', heal: 'Ретушую', inpaint: 'Видаляю',
    'dodge-burn': 'Світлотінь', warp: 'Пластика', write: 'Записую',
  };
  const human = n => STAGE[n] || (n.startsWith('tool:')
    ? 'Інструмент: ' + (LAYER_RU[n.slice(5)] || n.slice(5)) : n);
  const st = $('#stages');
  const list = S.stages || [];
  if (expert){
    st.innerHTML = list.map(s =>
      `<div><b>${s.stage}</b><span>${s.sec == null
        ? '<span class="spin"></span>' : s.sec+'s '+(s.note||'')}</span></div>`).join('');
  } else if (!list.length){
    st.innerHTML = '';
  } else {
    const run = list.find(s => s.sec == null);
    const secs = list.reduce((a, s) => a + (s.sec || 0), 0);
    st.innerHTML = run
      ? `<div><b><span class="spin"></span>${human(run.stage)}</b>
         <span>${list.length} з ${list.length}</span></div>`
      : `<div><b>Готово</b><span>${secs.toFixed(0)} с</span></div>`;
  }
  /* Числа кадру — чипами з поясненням на кожному. Було одним рядком у
     двадцять слів: усе видно, нічого не читається. Чип, який вимагає
     уваги, фарбується — і тоді його видно з іншого кінця панелі. */
  const chip = (icon, val, tip, cls) =>
    `<span class="chip ${cls || ''}" data-tip="${esc(tip)}">${
      icon ? `<svg class="ic sm"><use href="#i-${icon}"/></svg>` : ''
    }<b>${esc(String(val))}</b></span>`;
  const chips = [];
  if (S.loaded){
    chips.push(chip('', expert ? `${S.w}×${S.h}` : `${S.mp} Мп`,
      `${S.w}×${S.h}, ${S.mp} Мп — ${S.name}`));
    if (S.raw_decoder && expert) chips.push(chip('', S.raw_decoder,
      'чим прочитано RAW. Вибір декодера зсуває кількість знайденого'));
    const heur = S.skin_source === 'heuristic';
    const miss = (S.skin_source || '').includes('МИМО');
    chips.push(chip('mask',
      (S.skin_frac != null
        ? (expert ? (S.skin_frac*100).toFixed(1) + '%' : 'шкіра ' + (S.skin_frac*100).toFixed(1) + '%')
        : '—'),
      `маска шкіри, джерело: ${S.skin_source}` + (heur
        ? '\n\nЕВРИСТИКА — це тест на КОЛІР, а не на обличчя. На реальному портреті вона віддає 90+% кадру. Обери face-parsing зліва.'
        : miss ? '\n\nДетектор не знайшов обличчя, тож розбирався ПОВНИЙ кадр — це ненадійно, і ширина обличчя взята з габариту маски.'
        : ''),
      heur || miss ? 'warn' : ''));
    if (S.face_w && (expert || S.face_w_source !== 'detector'
                     || (S.faces_note||'').startsWith('УВАГА')
                     || S.n_faces > 1)) chips.push(chip('face',
      Math.round(S.face_w) + 'px' + (S.n_faces > 1 ? ` ×${S.n_faces}` : ''),
      (S.n_faces > 1 ? `обличчя в кадрі: ${(S.face_widths||[]).join(', ')} px\n` : 'ширина обличчя\n')
      + (S.faces_note || `джерело: ${S.face_w_source}`),
      S.face_w_source !== 'detector' || (S.faces_note||'').startsWith('УВАГА') ? 'warn' : ''));
    if (S.radius && (expert || S.radius_warn)) chips.push(chip('ruler', S.radius + 'px',
      'радіус частотного розділення' + (S.radius_warn ? '\n\n' + S.radius_warn : '')
      + (S.search_radius_px ? `\nпошук донора: ${S.search_radius_px} px` : ''),
      S.radius_warn ? 'warn' : ''));
    if (S.n_blobs != null) chips.push(chip('spots', S.n_blobs + ' плям',
      'знайдено дефектів' + ((S.blob_classes||[]).length
        ? '\nде саме: ' + S.blob_classes.map(
            c => `${expert ? c.name : (c.ua || c.name)} ${c.n}`).join(', ')
        : '') + (S.detect_warn ? '\n\n' + S.detect_warn : ''),
      S.detect_warn ? 'warn' : ''));
    if (S.healed != null) chips.push(chip('', (S.healed*100).toFixed(3) + '%',
      'торкнулися цієї частки КАДРУ', 'ok'));
    if (S.warp) chips.push(chip('warp', S.warp.max_px + 'px', 'пластика: зсув'));
    if (S.painted) chips.push(chip('mask', 'правлена', 'маску правили пензлем'));
  }
  $('#chips').innerHTML = chips.join('');
  $('#info').innerHTML = S.loaded ? esc(S.name) : 'кадр не відкрито';

  let m = '';
  if (S.error) m += `<div class="note bad">${esc(S.error)}</div>`;
  if (S.warn)  m += `<div class="note">${esc(S.warn)}</div>`;
  if (S.telea_warn) m += `<div class="note">${esc(S.telea_warn)}</div>`;
  if (S.detect_warn) m += `<div class="note">${esc(S.detect_warn)}</div>`;
  if (S.radius_warn) m += `<div class="note">${esc(S.radius_warn)}</div>`;
  if (S.faces_note && S.faces_note.startsWith('УВАГА'))
    m += `<div class="note">${esc(S.faces_note)}</div>`;
  if (S.written && S.written.length)
    m += `<div class="note" style="border-left-color:var(--ok)">Записано:\n` +
         esc(S.written.join('\n')) + `</div>`;
  $('#msg').innerHTML = m;

  for (const b of ['open','rerun','write']) $('#'+b).disabled = S.busy;
  if (S.busy) setTimeout(tick, 400);
}

/* alert() блокує сторінку до натискання — саме це читається як
   «підвисло». Повідомлення має з'явитись і зникнути само. */
let toastT = null;
function toast(text, bad){
  let el = $('#toast');
  if (!el){
    el = document.createElement('div');
    el.id = 'toast'; document.body.appendChild(el);
  }
  el.className = 'show' + (bad ? ' bad' : '');
  el.textContent = text;
  clearTimeout(toastT);
  toastT = setTimeout(() => el.className = '', bad ? 6000 : 2600);
}
const esc = s => (s||'').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const bust = () => '&_=' + Date.now();

/* ---------- вкладки ---------- */
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); tab = b.dataset.t; draw();
});

/* Пояснення в панелі згортаються — але не всі й не сліпо.

   Сховати можна ЛИШЕ прозу: підказка з повзунком усередині (розмір
   кропа, наприклад) — це керування, а не текст. Тому фільтруємо за
   наявністю контролів, а не за класом: клас довелося б проставляти в
   сорока місцях і десь забути.

   ПОПЕРЕДЖЕННЯ (.note) не згортаються ніколи. §1 будується на тому, що
   конвеєр нічого не робить мовчки, і сховати «39 зі 154 знахідок на
   шиї» за кнопкою означало б це порушити. */
const TIPS_KEY = 'retouch.tips';
let tipsOpen = localStorage.getItem(TIPS_KEY) !== '0';

/* Два режими, і за замовчуванням — «Просто».

   Перший зовнішній тест дав рівно цю відповідь: «виглядає технічно, для
   програмістів». Панель показувала `wb_multipliers`, `noise_thr` і
   посилання на калібрування — це мова коду, не мова фотографії.

   Нічого не ВИДАЛЕНО: «Експерт» повертає всі поля, машинні імена й
   технічні описи. §1 забороняє ховати правду, але не зобов'язує
   починати з неї розмову. */
const EXPERT_KEY = 'retouch.expert';
let expert = localStorage.getItem(EXPERT_KEY) === '1';
function setExpert(on){
  expert = on;
  localStorage.setItem(EXPERT_KEY, on ? '1' : '0');
  document.body.classList.toggle('expert', on);
  $('#expbtn').classList.toggle('on', on);
  $('#expbtn').querySelector('.lbl').textContent = on ? 'Експерт' : 'Просто';
  // Смужка етапів і чипи малюються в tick(), а не в draw() — без цього
  // перемикач міняв би панель, але лишав журнал у старому вигляді.
  tick().then(draw);
}

function foldHints(){
  $('#pane').querySelectorAll('.hint').forEach(h => {
    if (h.dataset.folded) return;
    if (h.querySelector('input,button,select,textarea')) return;
    if (h.textContent.trim().length < 90) return;
    h.dataset.folded = '1';
    const body = document.createElement('div');
    body.className = 'why-body';
    while (h.firstChild) body.appendChild(h.firstChild);
    const btn = document.createElement('button');
    btn.className = 'why-btn';
    btn.innerHTML = '<svg class="ic chev"><use href="#i-chev"/></svg>' +
                    '<svg class="ic"><use href="#i-q"/></svg>навіщо це';
    btn.onclick = () => h.classList.toggle('why-open');
    h.appendChild(btn); h.appendChild(body);
    if (tipsOpen) h.classList.add('why-open');
  });
}

function setTips(on){
  tipsOpen = on;
  localStorage.setItem(TIPS_KEY, on ? '1' : '0');
  $('#pane').querySelectorAll('.hint[data-folded]').forEach(
    h => h.classList.toggle('why-open', on));

  // що він запропонував, хочеться до того, як щось відкрито.

  if (tab === 'shoot') return drawShoot(p);
  if (!S.loaded){ p.innerHTML = '<div class="hint">Відкрий 16-бітний TIFF зліва.</div>'; return; }
  if (tab === 'view') return drawView(p);
  if (tab === 'crops') return drawCrops(p);
  if (tab === 'mask') return drawMask(p);
  if (tab === 'remove') return drawRemove(p);
  if (tab === 'warp') return drawWarp(p);
  if (tab === 'spots') return drawSpots(p);
  if (tab === 'layers') return drawLayers(p);
  if (tab === 'sweep') return drawSweep(p);
  if (tab === 'develop') return drawSection(p, 'develop');
  if (tab === 'db') return drawSection(p, 'db');
  if (tab === 'tools') return drawSection(p, 'tools');
  if (tab === 'presets') return drawPresets(p);

function drawMask(p){
  p.innerHTML = `<div class="hint">Малюй по кадру: <b>червоне</b> — додати шкіру,
    <b>синє</b> — прибрати. Правки лягають поверх автоматичної маски й
    переживають зміну параметрів. Конвеєр перерахується кнопкою «Перегнати».</div>
    <div class="row" style="margin-bottom:10px">
      <button id="b_add" class="pri">Додати</button>
      <button id="b_del">Прибрати</button>
      <label style="flex:0 0 auto;color:var(--dim)">пензель</label>
      <input type="range" id="bsize" min="4" max="90" value="26" style="width:120px">
      <button id="b_apply" class="pri">Застосувати</button>
      <button id="b_clear">Скинути правки</button>
    </div>
    ${classPanel()}
    <div id="stage"><div class="holder">
      <img id="nav" src="/api/view?kind=before&w=760${bust()}">
      <canvas id="paint"></canvas></div></div>`;
  const ap = $('#cls_apply');
  if (ap) ap.onclick = async () => {
    const sel = [...document.querySelectorAll('.cls:checked')].map(x => x.value);
    const r = await post('/api/classes', {skin_classes: sel});
    if (r.error) return toast(r.error, true);
    $('#cls_info').textContent = `маска ${(r.skin_frac*100).toFixed(1)}% — тепер «Перегнати»`;
    tick();
  };
  const img = $('#nav'), cv = $('#paint');
  img.onload = () => { cv.width = img.naturalWidth; cv.height = img.naturalHeight; };
  if (img.complete) img.onload();
  const ctx = () => cv.getContext('2d');
  const at = e => { const r = cv.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width * cv.width,
            (e.clientY - r.top) / r.height * cv.height]; };
  /* Мазок — ЛІНІЯ від попередньої точки, а не окреме коло на кожну
     подію. Події вказівника приходять рідше, ніж рухається рука, тож
     кола лягали з розривами: швидкий рух давав пунктир. Саме це й
     відчувається як «незручно малювати». */
  let prev = null;
  const stroke = e => {
    const [x, y] = at(e), c = ctx();
    const col = brush === 'add' ? 'rgba(255,40,40,.85)' : 'rgba(40,90,255,.85)';
    c.strokeStyle = c.fillStyle = col;
    c.lineWidth = (+$('#bsize').value) * 2;
    c.lineCap = c.lineJoin = 'round';
    if (prev){ c.beginPath(); c.moveTo(prev[0], prev[1]); c.lineTo(x, y); c.stroke(); }
    else { c.beginPath(); c.arc(x, y, +$('#bsize').value, 0, 7); c.fill(); }
    prev = [x, y];
  };
  cv.onpointerdown = e => {
    painting = true; prev = null; cv.setPointerCapture(e.pointerId); stroke(e); };
  cv.onpointermove = e => {
    if (!painting) return;
    // Проміжні події браузер копить: беремо всі, інакше на швидкому русі
    // губиться середина мазка.
    const pts = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const q of pts) stroke(q);
  };
  cv.onpointerup = () => { painting = false; prev = null; };
  $('#b_add').onclick = () => { brush = 'add';
    $('#b_add').classList.add('pri'); $('#b_del').classList.remove('pri'); };
  $('#b_del').onclick = () => { brush = 'del';
    $('#b_del').classList.add('pri'); $('#b_add').classList.remove('pri'); };
  $('#b_apply').onclick = async () => {
    const r = await post('/api/paint', {png: cv.toDataURL('image/png')});
    if (r.error) return toast(r.error, true);
    await tick(); toast('Маску оновлено. Тепер «Перегнати».');
  };
  $('#b_clear').onclick = async () => {
    ctx().clearRect(0, 0, cv.width, cv.height);
    await post('/api/paint', {clear: true}); tick();
  };
}

function drawRemove(p){
  p.innerHTML = `<div class="hint">Замалюй те, що прибрати — людину, предмет,
    смітник. Це НЕ прозорість: дірка заповнюється правдоподібним фоном.<br>
    Без ваг LaMa працює запасний Telea, і він тягне краї всередину — на
    глибині більш ніж 24 px це вже пляма, а не фон. Конвеєр про це скаже.</div>
    <div class="row" style="margin-bottom:10px">
      <label style="flex:0 0 auto;color:var(--dim)">пензель</label>
      <input type="range" id="rsize" min="6" max="140" value="40" style="width:130px">
      <button id="r_apply" class="pri">Прийняти маску</button>
      <button id="r_go" class="pri">Видалити</button>

      <span id="r_info" class="hint" style="margin:0"></span>
    </div>
    <div id="stage"><div class="holder">
      <img id="nav" src="/api/view?kind=after&w=760${bust()}">
      <canvas id="paint"></canvas></div></div>`;
  const img = $('#nav'), cv = $('#paint');
  const fit = () => { cv.width = img.naturalWidth; cv.height = img.naturalHeight; };
  img.complete && img.naturalWidth ? fit() : img.addEventListener('load', fit);
  const at = e => { const r = cv.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width * cv.width,
            (e.clientY - r.top) / r.height * cv.height]; };
  // Той самий безперервний мазок, що й на масці шкіри: окремі кола на
  // кожну подію дають пунктир, бо рука рухається швидше за події.
  let prevR = null;
  const strokeR = e => {
    const [x, y] = at(e), c = cv.getContext('2d');
    c.strokeStyle = c.fillStyle = 'rgba(255,40,40,.75)';
    c.lineWidth = (+$('#rsize').value) * 2;
    c.lineCap = c.lineJoin = 'round';
    if (prevR){ c.beginPath(); c.moveTo(prevR[0], prevR[1]); c.lineTo(x, y); c.stroke(); }
    else { c.beginPath(); c.arc(x, y, +$('#rsize').value, 0, 7); c.fill(); }
    prevR = [x, y];
  };
  cv.onpointerdown = e => {
    painting = true; prevR = null; cv.setPointerCapture(e.pointerId); strokeR(e); };
  cv.onpointermove = e => {
    if (!painting) return;
    for (const q of (e.getCoalescedEvents ? e.getCoalescedEvents() : [e])) strokeR(q);
  };
  cv.onpointerup = () => { painting = false; prevR = null; };
  const info = r => $('#r_info').textContent = r.remove_px
    ? `${(r.remove_px/1e6).toFixed(2)} Мп, глибина ${r.depth?.toFixed?.(0) ?? '?'} px`
    : 'маска порожня';
  $('#r_apply').onclick = async () => {
    const r = await post('/api/paint', {target:'remove', png: cv.toDataURL('image/png')});
    if (r.error) return toast(r.error, true);
    info(r); tick();
  };
  $('#r_clear').onclick = async () => {
    cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
    const r = await post('/api/paint', {target:'remove', clear:true}); info(r); tick();
  };
  $('#r_go').onclick = async () => {
    const a = await post('/api/paint', {target:'remove', png: cv.toDataURL('image/png')});
    if (a.error) return toast(a.error, true);
    info(a);
    const r = await post('/api/remove', {});
    if (r.error) return toast(r.error, true);
    await tick(); waitDone();
  };
  if (S.remove_px) $('#r_info').textContent =
    `${(S.remove_px/1e6).toFixed(2)} Мп, глибина ${S.remove_depth} px`;
}

async function drawSpots(p){
  const blobs = await api('/api/blobs');
  if (keep === null) keep = new Set(blobs.map(b => b.id));
  /* «контраст 0.0491, площа 13, 2071,2741» — це рядок із лога, а не
     те, за чим обирають. Фотограф вирішує «наскільки це помітно» і «яке
     воно завбільшки», тож у «Просто» те саме число показується смужкою
     й словами. Точні значення нікуди не діваються — вони в «Експерт».  */
  const HOW = b => b.contrast >= 0.035 ? 'дуже помітна'
                 : b.contrast >= 0.022 ? 'помітна'
                 : b.contrast >= 0.014 ? 'ледь помітна' : 'на межі видимого';
  const SIZE = b => b.area >= 200 ? 'велика' : b.area >= 40 ? 'середня' : 'дрібна';
  const top = blobs.length ? blobs[0].contrast : 1;
  p.innerHTML = `<div class="hint">Знято галочку — пляму не лікуємо, але заміну
    для сусідніх шукаємо в обхід неї. Найпомітніші зверху.</div>
    <div class="row"><button id="s_all">Усі</button><button id="s_none">Жодної</button>
      <button id="s_top">Топ-30</button>
      <button id="s_apply" class="pri">Лікувати вибрані (<span id="s_n"></span>)</button></div>
    <table><thead><tr><th></th><th>наскільки помітно</th><th>розмір</th>${
      expert ? '<th>контраст</th><th>площа</th><th>x,y</th>' : ''}</tr></thead>
    <tbody>${blobs.slice(0, 400).map(b => `<tr data-id="${b.id}">
      <td><input type="checkbox" data-id="${b.id}" ${keep.has(b.id)?'checked':''}></td>
      <td style="text-align:left"><span class="bar"><i style="width:${
        Math.max(4, Math.round(b.contrast / top * 100))}%"></i></span>${HOW(b)}</td>
      <td>${SIZE(b)}</td>${expert
        ? `<td>${b.contrast.toFixed(4)}</td><td>${b.area}</td><td>${b.x},${b.y}</td>`
        : ''}</tr>`).join('')}</tbody></table>`;
  const n = () => $('#s_n').textContent = keep.size;
  n();
  p.querySelectorAll('input[type=checkbox]').forEach(c => c.onchange = () => {
    const id = +c.dataset.id; c.checked ? keep.add(id) : keep.delete(id); n(); });
  const setAll = ids => { keep = new Set(ids);
    p.querySelectorAll('input[type=checkbox]').forEach(c =>
      c.checked = keep.has(+c.dataset.id)); n(); };
  $('#s_all').onclick = () => setAll(blobs.map(b => b.id));
  $('#s_none').onclick = () => setAll([]);
  $('#s_top').onclick = () => setAll(blobs.slice(0, 30).map(b => b.id));
  $('#s_apply').onclick = async () => {
    await post('/api/heal', {keep: [...keep]}); tick();
  };
  p.querySelectorAll('tr[data-id]').forEach(tr => tr.onclick = e => {
    if (e.target.type === 'checkbox') return;
    const b = blobs.find(x => x.id === +tr.dataset.id);
    cropAt = [b.x, b.y];
    document.querySelector('.tabs button[data-t=crops]').click();
  });
}

/* ---------- схема: форма будується з дата-класів ---------- */
/* Жодного поля тут не написано руками. Схема приходить з тих самих
   дата-класів, які читає агент (`--schema`), тому вкладка не може
   відстати від коду: нове поле в DevelopParams з'являється тут саме. */
let SCHEMA = null;
async function schema(){
  if (!SCHEMA) SCHEMA = await api('/api/schema');
  return SCHEMA;
}
const fid = (sec, key) => 'f_' + (sec + '_' + key).replace(/\W/g, '_');
const defTxt = d => d === null ? '—' : (Array.isArray(d) ? (d.length ? d.join(', ') : '—')
                                                         : String(d));

/* У режимі «Просто» показується людська назва й пояснення про
   ФОТОГРАФІЮ; машинне ім'я і технічний опис — тільки в «Експерт».

   Два тексти на поле, а не один перекладений: агентові потрібен
   «поріг перцентиля яскравості в межах класу», фотографу — «що вважати
   зубами, щоб не зачепити губи». Замінити одне іншим означало б
   зламати один із двох боків. */
function ctrl(sec, key, meta, cur){
  const id = fid(sec, key), t = meta.type, on = cur !== undefined;
  const v = on ? cur : '';
  let inp;
  if (t === 'bool')
    inp = `<input type="checkbox" id="${id}" ${v === true ? 'checked' : ''}>`;
  else if (t.startsWith('tuple') || t.startsWith('list'))
    inp = `<input type="text" id="${id}" value="${Array.isArray(v) ? v.join(', ') : esc(String(v))}"
             placeholder="${esc(defTxt(meta.default))}">`;
  else if (t === 'int' || t === 'float')
    inp = `<input type="number" step="${t === 'int' ? 1 : 0.01}" id="${id}"
             value="${v}" placeholder="${esc(defTxt(meta.default))}">`;
  else
    inp = `<input type="text" id="${id}" value="${esc(String(v))}"
             placeholder="${esc(defTxt(meta.default))}">`;
  const human = meta.label && meta.label !== key;
  const name = expert || !human ? key : meta.label;
  const tech = expert
    ? `<div class="doc tech">${esc(meta.doc)}</div>`
    : '';
  const hint = (!expert && meta.hint) ? `<div class="doc">${esc(meta.hint)}</div>`
             : (!expert ? '' : '');
  return `<div class="fld${on ? ' set' : ''}"><label for="${id}">${name}${
    expert && human ? `<span class="mach">${esc(meta.label)}</span>` : ''
  }</label>${inp}${hint}${tech}</div>`;
}

/* Поля, які фотограф крутить щодня, від тих, що мають сенс, коли знаєш
   будову. Ховається не назавжди — перемикачем угорі. */
function fieldsOf(sec, sc){
  const all = Object.entries(sc.sections[sec] || {});
  return expert ? all : all.filter(([, m]) => m.level === 'basic');
}

/* Порожнє поле означає «не задано», а не «нуль»: пресет частковий, і
   різниця між «не чіпаю» і «ставлю 0» тут змістова. Тому очищення поля
   ВИДАЛЯЄ ключ, а не пише в нього null. */
function bindFields(sec, fields, put){
  for (const key of Object.keys(fields)){
    const el = $('#' + fid(sec, key)), t = fields[key].type;
    if (!el) continue;
    el.onchange = () => {
      let v;
      if (t === 'bool') v = el.checked;
      else if (el.value.trim() === '') v = undefined;
      else if (t.startsWith('tuple') || t.startsWith('list'))
        v = el.value.split(',').map(x => parseFloat(x.trim())).filter(x => !isNaN(x));
      else if (t === 'int') v = parseInt(el.value, 10);
      else if (t === 'float') v = parseFloat(el.value);
      else v = el.value;
      put(key, v);
    };
  }
}

/* Видалити ключ = переслати пресет без нього. Сервер зливає, а не
   замінює, тож «прибрати» інакше не сказати. */
function dropKey(path){
  const d = JSON.parse(JSON.stringify(S.preset || {}));
  let node = d;
  for (const k of path.slice(0, -1)){ if (!node[k]) return d; node = node[k]; }
  delete node[path[path.length - 1]];
  return d;
}
async function pset(body){
  const r = await post('/api/preset', body);
  if (r.error){ $('#msg').innerHTML = `<div class="note bad">${esc(r.error)}</div>`; return; }
  await tick(); draw();
}
const setAt = (sec, key, v) => v === undefined
  ? pset({data: dropKey([sec, key]), replace: true})
  : pset({data: {[sec]: {[key]: v}}});

async function drawSection(p, which){
  // Схему й список пресетів треба спитати в сервера, і поки відповідь
  // іде, панель показувала б ВМІСТ ПОПЕРЕДНЬОЇ вкладки під новим
  // заголовком. Виглядає як «кнопка не працює», тому позначаємо чекання
  // одразу, синхронно, до першого await.
  p.innerHTML = '<div class="hint"><span class="spin"></span>читаю схему…</div>';
  const sc = await schema();
  if (which === 'develop') return drawDevelop(p, sc);
  if (which === 'db') return drawDB(p, sc);
  return drawTools(p, sc);
}

/* ---------- дрібні інструменти ---------- */
const TOOL_RU = {eye_vessels: 'судини в очах', teeth: 'зуби',
                 mattify: 'матування', skin_tone: 'тон шкіри'};

function toolState(){
  const t = (S.preset || {}).tools;
  if (Array.isArray(t)) { const o = {}; for (const n of t) o[n] = {}; return o; }
  return t && typeof t === 'object' ? t : {};
}

function drawTools(p, sc){
  const st = toolState();
  const names = Object.keys(sc.sections).filter(k => k.startsWith('tools.'))
                                        .map(k => k.slice(6));
  const done = S.tool_layers || [], touched = S.tool_touched || {};
  p.innerHTML = `<div class="hint">Кожен інструмент працює СТРОГО всередині свого
    класу face-parsing і віддається окремим шаром, тобто вимикається поодинці вже
    в Photoshop. Порядок галочок — порядок застосування.</div>
    ${S.has_cls ? '' : `<div class="note">Карти класів немає: без face-parsing
      невідомо, де око, а де рот. Обери модель зліва й перегони — інакше
      інструменти нічого не зроблять і мовчки пропустяться.</div>`}
    <div class="bar"><button id="gotools" class="pri"
      ${S.has_result && S.has_cls ? '' : 'disabled'}>Застосувати</button>
      <span class="hint" style="margin:0">${done.length
        ? done.map(n => `${TOOL_RU[n] || n} ${((touched[n] || 0) * 100).toFixed(2)}%`).join(' · ')
        : 'ще не застосовувались'}</span></div>
    ${names.map(n => {
      const on = n in st, opts = (typeof st[n] === 'object' && st[n]) || {};
      return `<h2 style="display:flex;gap:8px;align-items:center">
        <label style="display:flex;gap:7px;align-items:center;cursor:pointer;
          text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink)">
          <input type="checkbox" data-tool="${n}" ${on ? 'checked' : ''}
            style="accent-color:var(--acc);width:15px;height:15px">
          ${TOOL_RU[n] || n}</label>
        <span class="tag">${n}</span></h2>
        <div class="flds"${on ? '' : ' style="opacity:.45"'}>
        ${fieldsOf('tools.' + n, sc)
          .map(([k, m]) => ctrl('tool_' + n, k, m, opts[k])).join('')}</div>`;
    }).join('')}`;
  for (const n of names)
    bindFields('tool_' + n, sc.sections['tools.' + n], (k, v) => v === undefined
      ? pset({data: dropKey(['tools', n, k]), replace: true})
      : pset({data: {tools: {[n]: {[k]: v}}}}));
  p.querySelectorAll('[data-tool]').forEach(e => e.onchange = () => {
    const n = e.dataset.tool;
    // Вимкнення — саме видалення ключа, а не `false`: інакше пресет ніс
    // би «не роби цього», і накласти його на зйомку, де інструмент
    // потрібен, стало б неможливо.
    return e.checked ? pset({data: {tools: {[n]: {}}}})
                     : pset({data: dropKey(['tools', n]), replace: true});
  });
  $('#gotools').onclick = async () => {
    await post('/api/stage', {stage: 'tools', params: params()});
    await tick(); waitDone();
  };
}

/* ---------- пресети ---------- */
/* JSON.stringify розкладає кожне число кривої в окремий рядок, і крива
   на дванадцять точок займає пів екрана, виштовхуючи все інше. Тому
   масиви самих чисел (і масиви таких масивів) складаємо в рядок. */
function compactJson(o){
  let t = JSON.stringify(o, null, 2), prev;
  do { prev = t;
    t = t.replace(/\[\s*\n\s*((?:-?[\d.eE+-]+|\[[^\[\]]*\])(?:,\s*\n?\s*(?:-?[\d.eE+-]+|\[[^\[\]]*\]))*)\s*\n\s*\]/g,
      (m, inner) => '[' + inner.replace(/\s+/g, ' ').trim() + ']');
  } while (t !== prev);
  return t;
}

  p.innerHTML = `<div class="hint">Пресет частковий: задає лише те, що змінює, і
    накладається поверх попереднього. Поле <b>чому</b> — головне: коли агент дав
    десять варіантів, у числах вони виглядають однаково.</div>

    <div class="grid" style="grid-template-columns:1fr 1fr;align-items:start">
      <div><h2>Активний${S.preset_name ? ' · ' + esc(S.preset_name) : ''}</h2>
        ${keys.length
          ? `<pre class="yaml">${esc(compactJson(cur))}</pre>`
          : '<div class="hint">Порожній — усе на дефолтах дата-класів.</div>'}
        <div class="bar"><button id="pclear">Очистити</button>
          <button id="pxmp" ${S.loaded ? '' : 'disabled'}>Взяти з XMP</button></div>
        <h2>Зберегти</h2>
        <div class="row"><input type="text" id="pfile" placeholder="назва файлу"
          value="${esc((S.name || 'preset').replace(/\.[^.]+$/, ''))}"></div>
        <div class="row"><input type="text" id="pwhy" placeholder="чому саме так"></div>
        <div class="row"><button id="psave" class="pri" style="width:100%"
          ${keys.length ? '' : 'disabled'}>Записати в presets/</button></div></div>
      <div><h2>Порівняти на цьому кадрі</h2>
        <div class="hint">Обрати з десяти пресетів по YAML неможливо — у числах
          вони виглядають однаково. Дивитись треба в 1:1: на зменшеному різниці
          в ретуші немає за визначенням. Точку бере клац на вкладці «1:1»,
          типово — найконтрастніша пляма.</div>
        <div class="bar"><button id="vgo" class="pri"
          ${S.loaded ? '' : 'disabled'}>Порівняти обрані</button>
          <span class="hint" style="margin:0">розмір
            <input type="number" id="vsize" value="400" min="100" max="900"
              style="width:70px"> px</span></div>
        <div id="vout"></div>
      </div>
      <div><h2>У теці presets/</h2>
        <div class="pick plist" style="max-height:none">${list.length ? list.map((r, i) =>
          `<div data-p="${esc(r.path)}">
            <label style="float:right;cursor:pointer"><input type="checkbox"
              class="vpick" value="${esc(r.path)}"
              style="accent-color:var(--acc)"></label>
            <b>${esc(r.name)}</b>
            <span class="tag">${esc(r.dir || r.file)}</span>
            ${r.error ? `<div class="why" style="color:var(--bad)">${esc(r.error)}</div>`
                      : `<div class="why">${esc(r.why || '—')}</div>
                         <div class="why">${(r.keys || []).join(', ')}</div>`}</div>`
          ).join('') : '<div style="padding:9px;color:var(--dim)">порожньо</div>'}</div>
        <div class="hint" style="margin-top:8px">Клац — накласти поверх активного.</div>
      </div></div>`;
  p.querySelectorAll('[data-p]').forEach(e => {
    e.onclick = ev => {
      if (ev.target.type === 'checkbox') return;   // галочка — це вибір для порівняння
      pset({path: e.dataset.p});
    };
  });
  const chosen = () => [...p.querySelectorAll('.vpick:checked')].map(e => e.value);
  $('#vgo').onclick = async () => {
    const ps = chosen();
    if (!ps.length){ toast('Постав галочки біля пресетів, які порівнюємо.'); return; }
    const pt = cropAt || (S.n_blobs ? null : [0, 0]);
    const b = pt || [Math.round(S.w/2), Math.round(S.h/2)];
    await post('/api/variants', {presets: ps, x: b[0], y: b[1],
                                 size: +$('#vsize').value, params: params()});

    if (r.error){ $('#xmprep').innerHTML = `<div class="note bad">${esc(r.error)}</div>`; return; }
    // «×» показуємо поруч із рештою, а не за «докладніше». Те, чого ми
    // НЕ зробили, — найважливіша частина цього звіту: інакше кадр
    // виглядає проявленим як в ACR, а це не так.
    const rows = (o, sign, cls) => Object.entries(o || {})
      .map(([k, v]) => `<div><b style="color:${cls}">${sign}</b> ${esc(k)}: ${esc(v)}</div>`)
      .join('');
    $('#xmprep').innerHTML =
      `<div class="note" style="border-left-color:var(--ok)"><b>${esc(r.summary)}</b>
        <div class="hint" style="margin:4px 0 8px">${esc(r.source)}</div>
        ${rows(r.exact, '=', 'var(--ok)')}
        ${rows(r.approx, '≈', 'var(--warn)')}
        ${rows(r.ignored, '×', 'var(--bad)')}</div>`;
    await tick();
    const keep = $('#xmprep').innerHTML;
    await drawPresets($('#pane'));
    $('#xmprep').innerHTML = keep;
  };
  $('#psave').onclick = async () => {
    const r = await post('/api/preset/save',
      {file: $('#pfile').value || 'preset', why: $('#pwhy').value,
       name: $('#pfile').value || undefined});
    $('#msg').innerHTML = r.error
      ? `<div class="note bad">${esc(r.error)}</div>`
      : `<div class="note" style="border-left-color:var(--ok)">записано ${esc(r.path)}</div>`;
    draw();
  };
}

/* ---------- шари: непрозорість без перегону ---------- */
/* : збирає стопку тепер власний UI, а не Photoshop, і послабити
   шар має бути можна тут. Складання коштує частки секунди, перегін —
   пів хвилини на 26 Мп; рішення «трохи менше» приймають, дивлячись на
   результат, тож ціна має бути саме такою. */
const LAYER_RU = {skin: 'шкіра', remove: 'видалення', dodgeburn: 'світлотінь',
                  eye_vessels: 'судини в очах', teeth: 'зуби',
                  mattify: 'матування', skin_tone: 'тон шкіри'};

function drawLayers(p){
  const rows = (S.layers || []).slice();
  if (S.db_layer) rows.push({...S.db_layer, touched: null});
  if (!S.has_result){
    p.innerHTML = '<div class="hint">Спершу «Перегнати» — шарів ще немає.</div>';
    return;
  }
  p.innerHTML = `<div class="hint">Непрозорість не переганяє конвеєр, лише
    перескладає стопку. Записаний файл збігається з тим, що тут видно:
    непрозорість множить АЛЬФУ шару, а зведений пишеться тим самим
    складанням.<br>Світлотінь послаблюється зсувом до 50% сірого —
    саме воно нейтральне в Soft Light, а не нуль.</div>
    ${rows.length ? rows.map(r => `
      <div class="row"><label style="flex:0 0 130px">${
        LAYER_RU[r.name] || r.name}</label>
        <input type="range" class="opa" data-l="${r.name}" min="0" max="1"
          step="0.05" value="${r.opacity}">
        <span class="val" id="opa_${r.name}">${Math.round(r.opacity*100)}%</span>
        <span class="hint" style="margin:0;flex:0 0 110px">${
          r.touched == null ? '' : (r.touched*100).toFixed(2) + '% кадру'}</span>
      </div>`).join('')
      : '<div class="hint">Стопка порожня — жоден етап нічого не торкнувся.</div>'}
    <div class="row"><button id="opareset">Усі на 100%</button></div>
    <div class="grid" style="margin-top:10px">${card('before','ДО')}${
      card('after','ПІСЛЯ')}${card('diff','РІЗНИЦЯ ×4')}</div>`;

  let timer = null;
  const push = async () => {
    const o = {};
    p.querySelectorAll('.opa').forEach(e => o[e.dataset.l] = +e.value);
    await post('/api/opacity', {opacity: o});
    await tick(); draw();
  };
  p.querySelectorAll('.opa').forEach(e => {
    e.oninput = () => {
      $('#opa_' + e.dataset.l).textContent = Math.round(e.value*100) + '%';
      clearTimeout(timer); timer = setTimeout(push, 250);
    };
  });
  $('#opareset').onclick = () => {
    p.querySelectorAll('.opa').forEach(e => e.value = 1);
    push();
  };
}

/* ---------- зйомка: кадри теки, навігація, пакет ---------- */
/* Головна відсутня річ для роботи з реальною зйомкою була не функція, а
   НАВІГАЦІЯ: 44 кадри доводилось відкривати, набираючи шлях щоразу. */
let SHOOT = [];

async function loadShoot(dir, out){
  SHOOT = await api(`/api/session?dir=${encodeURIComponent(dir||'')}` +
                    `&out=${encodeURIComponent(out||'out')}`);
  return SHOOT;
}
const shootIdx = () => SHOOT.findIndex(f => S.path && f.path &&
  (S.path === f.path || S.path.endsWith('/' + f.file)));

async function openFrame(path){
  $('#path').value = path;
  await post('/api/open', {path, params: params()});
  await tick(); waitDone();
}
async function stepFrame(d){
  const i = shootIdx();
  const n = i < 0 ? 0 : Math.min(SHOOT.length - 1, Math.max(0, i + d));
  if (SHOOT[n]) await openFrame(SHOOT[n].path);
}

async function drawShoot(p){
  const dir = S.shoot_dir || '';
  p.innerHTML = `<div class="hint">Тека зйомки: кадри відкриваються кліком,
    <kbd>←</kbd> <kbd>→</kbd> гортають. Позначка «записано» береться з того самого
    зведеного файлу, за яким пакет вирішує, що кадр уже оброблено — щоб
    «готово» в панелі й «готово» в пакеті означали одне й те саме.</div>
    <div class="row">
      <input type="text" id="sdir" value="${esc(dir)}" placeholder="тека з кадрами">
      <input type="text" id="sout" value="${esc(S.shoot_out||'out')}"
        placeholder="куди писати" style="max-width:150px">
      <button id="sload" class="pri">Прочитати</button>
    </div>
    <div class="row"><button id="sprev">← попередній</button>
      <button id="snext">наступний →</button>
      <button id="sbatch" style="margin-left:auto">Прогнати всю теку</button>
      <label style="display:flex;gap:6px;align-items:center;color:var(--dim);
        font-size:12px"><input type="checkbox" id="sxmp"
        style="accent-color:var(--acc)"> з XMP</label></div>
    <div id="srolls"></div>`;
  $('#sload').onclick = async () => {
    await loadShoot($('#sdir').value, $('#sout').value); await tick(); draw();
  };
  $('#sprev').onclick = () => stepFrame(-1);
  $('#snext').onclick = () => stepFrame(1);
  $('#sbatch').onclick = async () => {
    // Пакет пише в ту саму теку й тими самими налаштуваннями, що видно
    // зараз, — включно з активним пресетом.
    if (!confirm(`Прогнати ${SHOOT.length} кадрів у ${$('#sout').value}?\n` +
                 `Уже записані пропускаються.`)) return;
    await post('/api/session/batch', {dir: $('#sdir').value, out: $('#sout').value,
                                      params: params(), xmp: $('#sxmp').checked});
    await tick(); waitDone();
  };

  if (dir && !SHOOT.length) await loadShoot(dir, S.shoot_out);
  const bat = {};
  for (const b of (S.batch || [])) bat[b.file] = b;
  const cur = shootIdx();
  $('#srolls').innerHTML = SHOOT.length
    ? `<div class="hint">${SHOOT.length} кадрів, записано
        ${SHOOT.filter(f => f.done).length}</div>
       <div class="roll">${SHOOT.map((f, i) => {
         const b = bat[f.file];
         const mark = b ? (b.status === 'done' ? `<span class="ok">${b.sec}s</span>`
                        : b.status === 'failed' ? `<span class="fail">збій</span>`
                        : `<span>проп.</span>`)
                    : (f.done ? '<span class="ok">записано</span>'
                              : `<span>${f.mb} МБ</span>`);
         return `<div data-open="${esc(f.path)}" class="${i === cur ? 'cur' : ''}${
           f.done ? ' done' : ''}"><span>${esc(f.file)}</span>${mark}</div>`;
       }).join('')}</div>`
    : '<div class="hint">Вкажи теку й натисни «Прочитати».</div>';
  $('#srolls').querySelectorAll('[data-open]').forEach(e =>
    e.onclick = () => openFrame(e.dataset.open));
}

/* ← → гортають кадри, коли фокус не в полі вводу */
document.addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)) return;
  if (e.key === 'ArrowLeft') stepFrame(-1);
  if (e.key === 'ArrowRight') stepFrame(1);
});

/* ---------- калібрування ---------- */
function drawSweep(p){
  const rows = S.sweep || [];
  p.innerHTML = `<div class="hint">Той самий кадр кількома порогами — таблиця
    зі spec.md калібрування. Порівнюй колонки між прогонами, а не з таблицею в специфікації:
    та знята на плоскому клапті шкіри.<br>
    <b>Але:</b> поріг міряється поверх маски. Поки маска не від face-parsing,
    калібрування безпідставне </div>
    <div class="row"><input type="text" id="ths" value="0.008, 0.012, 0.018, 0.025">
      <button id="go" class="pri">Прогнати</button></div>
    ${rows.length ? `<table><thead><tr><th>поріг</th><th>компонент</th>
      <th>радіус</th><th>торкнулися</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td>${r.threshold}</td><td>${r.n_blobs}</td>
      <td>${r.radius}px</td><td>${(r.touched*100).toFixed(3)}%</td></tr>`).join('')}
      </tbody></table>` : '<div class="hint">Ще не міряно.</div>'}`;
  $('#go').onclick = async () => {
    const th = $('#ths').value.split(',').map(s => parseFloat(s.trim()))
      .filter(x => x > 0);
    await post('/api/sweep', {params: params(), thresholds: th}); tick();
  };
}

/* ---------- файли ---------- */
$('#browse').onclick = async () => {
  const box = $('#picker'); box.hidden = !box.hidden;
  if (!box.hidden) await listDir($('#path').value || '');
};
async function listDir(d){
  const r = await api('/api/browse?dir=' + encodeURIComponent(d));
  $('#picklist').innerHTML =
    `<div class="d" data-d="${r.up}">↑ ..</div>` +
    r.dirs.map(n => `<div class="d" data-d="${r.dir}/${n}">${n}/</div>`).join('') +
    r.files.map(f => `<div data-f="${r.dir}/${f.name}" class="${f.raw?'raw':''}">
      <span>${f.name}${f.raw?' · RAW':''}</span>
      <span>${f.mb} МБ</span></div>`).join('');
  $('#picklist').querySelectorAll('[data-d]').forEach(e =>
    e.onclick = () => listDir(e.dataset.d));
  $('#picklist').querySelectorAll('[data-f]').forEach(e =>
    e.onclick = () => { $('#path').value = e.dataset.f; $('#picker').hidden = true; });
}

/* ---------- кнопки ---------- */
$('#open').onclick = async () => {
  keep = null; cropAt = null;
  const r = await post('/api/open', {path: $('#path').value, params: params()});
  if (r.error) $('#msg').innerHTML = `<div class="note bad">${esc(r.error)}</div>`;
  await tick(); waitDone();
};
$('#rerun').onclick = async () => {
  await post('/api/rerun', {params: params(), keep: keep ? [...keep] : null});
  await tick(); waitDone();
};
$('#write').onclick = async () => {
  await post('/api/write', {out: $('#out').value, preview: true});
  await tick(); waitDone();
};
function waitDone(){
  const t = setInterval(async () => {
    await tick();
    if (!S.busy){ clearInterval(t); draw(); }
  }, 500);
}
/* ---------- моделі: знаходимо самі, шляхів не набирати ---------- */
async function loadModels(){
  const m = await api('/api/models');
  const fill = (id, list, none) => {
    const el = $('#'+id);
    el.innerHTML = `<option value="">${none}</option>` +
      list.map(x => `<option value="${x.path}">${x.name} · ${x.mb} МБ</option>`).join('');
    if (list.length) el.value = list[0].path;   // найперша — зазвичай легша
  };
  fill('face_model', m.face, 'евристика (без моделі)');
  fill('face_detector', m.detector, 'без кропа обличчя');
  fill('lama_model', m.lama, 'Telea (без моделі)');
  const n = m.face.length + m.detector.length + m.lama.length;
  $('#models_hint').innerHTML = n
    ? `знайдено ${n} моделей у models/ — розпізнано за підписом, не за назвою`
    : `у models/ нічого немає. Без face-parsing маска евристична, і на
       вуличному кадрі вона непридатна — див. README.`;
  if (!m.lama.length) $('#models_hint').innerHTML +=
    `<br>Без LaMa видалення працює через Telea: дрібне прибере, велику
     дірку розмаже.`;
}
$('#tipsbtn').onclick = () => setTips(!tipsOpen);
$('#expbtn').onclick = () => setExpert(!expert);
setTips(tipsOpen);
setExpert(expert);
loadModels();
tick().then(draw);
</script>
