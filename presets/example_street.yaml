name: вулиця, фон у кольорі шкіри
why: |
  Бежевий камінь і світле пальто лежать у тому ж діапазоні, що й шкіра,
  тому евристична маска тут непридатна — потрібен face-parsing.
  Поріг трохи піднято: на цьому кадрі 0.012 давало спрацювання по віях.

  Набір класів тут БІЛЬШЕ НЕ ЗАДАЄТЬСЯ: (skin, nose) стало дефолтом
  після того, як на реальному кадрі виявилось, що neck дає 39 зі 154
  знахідок і лікування рве ланцюжок (spec.md §6.2). Пресет має задавати
  лише те, що ВІДРІЗНЯЄТЬСЯ від дефолту, інакше він мовчки фіксує
  значення, які завтра зміняться.
for: вуличні портрети, тепле світло, русяве волосся
detect:
  threshold: 0.014
