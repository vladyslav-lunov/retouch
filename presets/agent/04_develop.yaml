name: проявлення — підняти тіні
why: |
  Медіана яскравості 0.205 — кадр темнуватий, гістограма зібрана в
  нижній третині. Підняв на 2/3 стопа: до зрізу світел лишається запас,
  p99 було 0.878. Контраст трохи опущено, бо S-крива на такому кадрі
  забирає деталь у тінях, а вона там потрібна.
  Ретуш не чіпаю — це окремий пресет, вони накладаються.
for: IMG_0059, вулиця, тінь від аркади
develop:
