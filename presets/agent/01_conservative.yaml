name: обережний — тільки помітне
why: |
  Шкіра на кропах 1:1 чиста. При 0.012 детектор дає 143 плями на такому
  обличчі — це не дефекти, це дрібні лінії під оком і край вій, тобто
  характер, а не вада. Поріг 0.018 лишає 53 і бере саме те, що видно.
  Ланцюжок на грудях: neck знято, бо він законно вважається шкірою і
  детектор ріже ланки.
for: чисте обличчя, вулиця, тепле світло
detect:
  threshold: 0.018
mask:
  skin_classes: [skin, nose]
