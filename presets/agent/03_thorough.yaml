name: ретельний — але з лімітом
why: |
  Низький поріг ловить усе, включно з дрібницею, тому окремо стоїть
  ліміт: лікуються лише 60 найконтрастніших. Плями відсортовані за
  контрастом, тож це «прибери найпомітніше, решту лишаю як є» — краще,
  ніж піднімати поріг і втрачати справжні дефекти середньої сили.
for: якщо на інших кадрах серії шкіра гірша
detect:
  threshold: 0.010
limit: 60
strength: 0.9
mask:
  skin_classes: [skin, nose]
