name: з шиєю та декольте
why: |
  Дефолт ретушує лише обличчя: neck прибрано з набору класів, бо на
  ньому лежать ланцюжки й коміри, і лікування їх рве (spec.md §6.2).
  Цей пресет вмикає шию назад — для кадрів, де шкіра шиї справді
  потребує роботи, а прикрас на ній немає.

  ПЕРЕД прогоном подивись на розподіл знахідок по класах у звіті
  детекції. Якщо в neck осіла помітна частка — там прикраса, і пресет
  не підходить саме до цього кадру.
for: портрети без прикрас на шиї, студія
mask:
  skin_classes: [skin, nose, neck]
